# ---------------------------------------------------------------------------
# HMS — production stack.
#   cp .env.example .env   (set POSTGRES_PASSWORD, JWT_SECRET, SESSION_SECRET, CORS_ORIGINS, …)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend npm run seed:prod     # first-run seed (SEED_MODE in .env)
# Everything is served by nginx on ${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80} (frontend + /api + /uploads).
# Optional profiles:
#   --profile tunnel   Cloudflare Tunnel (CLOUDFLARE_TUNNEL_TOKEN) — no inbound ports needed
#   --profile backup   nightly pg_dump into the `backups` volume (BACKUP_KEEP_DAYS, BACKUP_CRON)
# ---------------------------------------------------------------------------
name: hms

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hms
      TZ: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 10s
      timeout: 5s
      retries: 12
    # not published to the host; reach it with `docker compose exec postgres psql -U hms hms`

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hms-backend:latest
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://hms:${POSTGRES_PASSWORD}@postgres:5432/hms
      STORAGE_PATH: /data/uploads
      BACKUP_PATH: /data/backups
      TZ: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["4000"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:4000
    image: hms-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      TZ: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
    depends_on:
      - backend
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/hms.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ---- optional: Cloudflare Tunnel (public HTTPS without opening ports) ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *default-logging
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
      TUNNEL_TRANSPORT_PROTOCOL: ${CLOUDFLARE_TUNNEL_PROTOCOL:-auto}   # http2 if UDP/7844 (QUIC) is blocked
      TZ: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
    depends_on:
      - nginx
    # In the Cloudflare dashboard point the tunnel's public hostname at http://nginx:80

  # ---- optional: scheduled database backups ----
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGUSER: hms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: hms
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-15 2 * * *}   # 02:15 daily
      TZ: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
    volumes:
      - backups:/backups
      - ./deploy/backup/backup.sh:/usr/local/bin/hms-backup:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$BACKUP_CRON /usr/local/bin/hms-backup >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "Backup schedule: $$BACKUP_CRON (keeping $$BACKUP_KEEP_DAYS days)"
        exec crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:
