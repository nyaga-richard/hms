# ---------------------------------------------------------------------------
# HMS — local DEVELOPMENT stack (hot reload). Deliberately not named docker-compose.yml so that a bare
# `docker compose up` on a server can never start the dev stack by accident (production: docker-compose.prod.yml).
#   cp .env.example .env            # then edit secrets
#   docker compose -f docker-compose.dev.yml up --build            (or: npm run docker:dev)
#   docker compose -f docker-compose.dev.yml exec backend npm run seed -w backend   # demo data (idempotent)
# App: http://localhost:3000   API: http://localhost:4000/api   DB: 127.0.0.1:${DEV_DB_PORT:-5432}
# ---------------------------------------------------------------------------
name: hms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: hms
      TZ: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"   # loopback only; change DEV_DB_PORT if 5432 is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro   # creates hms_test for the test suite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -w backend"
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://hms:${POSTGRES_PASSWORD:-change_me}@postgres:5432/hms
      DATABASE_URL_TEST: postgresql://hms:${POSTGRES_PASSWORD:-change_me}@postgres:5432/hms_test
      STORAGE_PATH: /data/uploads
      BACKUP_PATH: /data/backups
      CORS_ORIGINS: "*"
    ports:
      - "4000:4000"
    volumes:
      - ./:/app                      # live source
      - node_modules:/app/node_modules
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -w frontend"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://backend:4000   # Next dev server proxies /api/* here
      WATCHPACK_POLLING: "true"                   # reliable file watching on Docker Desktop
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/frontend/.next
    depends_on:
      backend:
        condition: service_healthy   # backend finishes the shared `npm install` first

volumes:
  pgdata:
  node_modules:
  next_cache:
  uploads:
  backups:
