# Reverse proxy in front of the HMS frontend (Next.js) and backend (Express).
# TLS is expected to be terminated upstream (Cloudflare Tunnel / load balancer); add a 443 server block
# with your certificates if you expose this host directly.

upstream hms_frontend { server frontend:3000; keepalive 32; }
upstream hms_backend  { server backend:4000;  keepalive 32; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Real client address: Cloudflare Tunnel delivers it in CF-Connecting-IP; otherwise use the TCP peer.
map $http_cf_connecting_ip $client_ip { default $http_cf_connecting_ip; '' $remote_addr; }
# Original scheme: Cloudflare sends X-Forwarded-Proto: https; on the LAN fall back to the local scheme.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;          # attachments / CSV imports
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header X-Forwarded-For   $client_ip;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Connection        "";
    proxy_read_timeout 300s;           # long exports / backups

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # Block Next.js / Express internals nobody should reach from the internet
    location ~ ^/(\.env|\.git) { return 404; }

    # API and uploaded files go straight to the backend (bypassing the Next.js rewrite hop)
    location /api/     { proxy_pass http://hms_backend; }
    location /uploads/ { proxy_pass http://hms_backend; }

    # Next.js static assets: long cache
    location /_next/static/ {
        proxy_pass http://hms_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://hms_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
